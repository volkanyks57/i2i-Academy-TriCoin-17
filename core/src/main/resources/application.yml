spring:
  application:
    name: tricoin-core

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:tricoin}
    username: tricoin_user
    password: tricoin_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

server:
  port: 8080

logging:
  level:
    com.tricoin.core: DEBUG
    org.hibernate.SQL: DEBUG

jwt:
  secret: ${JWT_SECRET:tricoin-dev-secret-key-change-in-production-min-256-bits}
  expiration-ms: 3600000