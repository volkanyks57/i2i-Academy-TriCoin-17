spring:
  application:
    name: tricoin-core

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:tricoin}
    username: ${DB_USERNAME:tricoin_user}
    password: ${DB_PASSWORD:tricoin_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: 8080

logging:
  level:
    com.tricoin.core: DEBUG
    org.hibernate.SQL: DEBUG

jwt:
  secret: ${JWT_SECRET:tricoin-dev-secret-key-change-in-production-min-256-bits}
  expiration-ms: 3600000

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-flash-lite-latest
  timeout-seconds: 30